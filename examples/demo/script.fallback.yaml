# Hand-written fallback for the demo story. Showtime uses it when Copado AI's answer is unusable.
version: 1
story:
  name: US-FALLBACK
  title: Showtime Demo – VIP Case Escalation
source: fallback
feature: VIP Case Escalation
summary:
  - Accounts now have a VIP checkbox.
  - A new case on a VIP account is set to High priority automatically.
  - The case shows a VIP badge, so your team sees it at a glance.
steps:
  - id: open-accounts
    action: navigate
    target: Accounts
    caption: Open the Accounts list
    narration: Let's start in Accounts, where your service team finds every customer.
  - id: open-vip-account
    action: click
    target: Stellar Widgets (fictional VIP)
    caption: Open a VIP customer
    narration: Here's one of your VIP customers. Notice nothing special to remember when a case comes in.
  - id: new-case
    action: click
    target: New Case
    caption: Create a new case
    narration: Now this customer calls with a problem, so your agent opens a new case for them.
  - id: type-subject
    action: type
    target: Subject
    value: Order portal is down
    caption: Describe the problem
    narration: They describe the problem in a few words. That's all your agent has to do.
  - id: save-case
    action: click
    target: Save
    caption: Save the case
    narration: They save the case, and the new automation takes over from here.
  - id: open-case
    action: click
    target: was created
    caption: Open the new case
    narration: Let's open the case that was just created, to see what happened behind the scenes.
  - id: verify-result
    action: verify
    target: Priority
    value: High | VIP CUSTOMER
    caption: High priority and a VIP badge
    narration: Priority is High, and the VIP badge shows. Nobody had to escalate anything by hand.
