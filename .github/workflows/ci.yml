name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  offline-demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Render the offline demo (silent narration, no credentials)
        run: SHOWTIME_TTS=silent bash examples/demo/try-offline.sh
      - name: Check the video
        run: |
          VIDEO=.showtime-demo/.showtime/shows/US-DEMO-001/video/US-DEMO-001.mp4
          test -s "$VIDEO"
          FF=$(node -p 'require("ffmpeg-static")')
          "$FF" -hide_banner -i "$VIDEO" 2>&1 | tee /tmp/probe.txt | grep -E "Duration|Video:|Audio:"
          grep -q "1920x1080" /tmp/probe.txt
          grep -q "Audio:" /tmp/probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: offline-demo-video
          path: .showtime-demo/.showtime/shows/US-DEMO-001/video/*.mp4
